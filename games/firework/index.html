<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#06020f" />
    <meta name="description" content="GUN HIT — Tembak lingkaran berputar dengan Keris, Black Hole, Yoyo, Diamond, atau Crystal Gun!" />
    <title>GUN HIT – 5 Senjata: Keris, Black Hole, Yoyo, Diamond, Crystal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎆</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #06020f; height: 100%; }
      #boot-msg {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        color: #fff; font-family: sans-serif; text-align: center; padding: 24px;
      }
      #boot-msg .spin {
        width: 42px; height: 42px; border-radius: 50%;
        border: 4px solid rgba(255,255,255,.2); border-top-color: #ffd75e;
        animation: bootspin 0.9s linear infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-msg">
        <div class="spin"></div>
        <div>Memuat GUN HIT…</div>
        <noscript>Game ini butuh JavaScript. Aktifkan JavaScript di browser kamu.</noscript>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
